name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (requires-python >= 3.10) and newest Python on Linux;
        # the versions in between rarely catch anything those two miss.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.15"]
        include:
          # Real speech backends (say / PowerShell SAPI) only exist on these.
          - os: macos-latest
            python-version: "3.15"
          - os: windows-latest
            python-version: "3.15"
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install espeak-ng (Linux speech backend)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - run: pip install -r requirements.txt pytest
      - run: pytest -v
