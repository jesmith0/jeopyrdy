[project]
name = "jeopyrdy"
version = "0.2.0"
description = "Multi-player celebrity Jeopardy simulator using pygame, with support for PS2 BUZZ! controllers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame-ce>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py310"
src = ["app"]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
